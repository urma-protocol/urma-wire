[package]
name = "wire-app-shared"
version = "0.1.0"
edition = "2021"
publish = false
description = "URMA Wire domain models, avatar renderer, and traits"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
urma-core = "0.1.0"
urma-runtime = "0.1.0"
bitcoin = { version = "0.32", features = ["rand-std"] }
rand = "0.8"
minreq = { version = "2.14", features = ["https-rustls"] }

urma-identity = "0.1.0"
urma-wallet = "0.1.0"
urma-chain = "0.1.0"
urma-io = "0.1.0"

[dev-dependencies]
tempfile = "3"
