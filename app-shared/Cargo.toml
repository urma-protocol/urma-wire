[package]
name = "wire-app-shared"
version = "0.1.0"
edition = "2021"
publish = false
description = "URMA Wire domain models, avatar renderer, and traits"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
urma-core = "0.2.0"
pulldown-cmark = { version = "0.13", default-features = false }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
urma-runtime = "0.2.0"
urma-wire = "0.2.0"
urma-workflows = "0.2.0"
fs2 = "0.4"
zeroize = "1"
bitcoin = { version = "0.32", features = ["rand-std"] }
rand = "0.8"
minreq = { version = "2.14", features = ["https-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "avif-native"] }
base64 = "0.22"

urma-identity = "0.2.0"
urma-wallet = "0.2.0"
urma-chain = "0.2.0"
urma-io = "0.2.0"

[dev-dependencies]
tempfile = "3"
