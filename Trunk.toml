[build]
target = "index.html"
dist = "dist"

[watch]
watch = ["app-core", "app-engine", "app-ui", "styles.css", "index.html", "assets", "web"]

[serve]
address = "127.0.0.1"
port = 8080
open = false

[[hooks]]
stage = "post_build"
command = "python3"
command_arguments = ["scripts/offline_manifest.py"]
