[package]
name = "wire-app-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "URMA Wire engines: one shared projection and record codec, a native and a browser backend"

[features]
fixture-harness = []

[dependencies]
wire-app-core = { path = "../app-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
zeroize = "1"
urma-core = "0.2.0"
urma-chain = "0.2.0"
urma-identity = "0.2.0"
urma-runtime = "0.2.0"
urma-wallet = "0.2.0"
urma-wire = "0.2.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bitcoin = { version = "0.32", features = ["rand-std"] }
urma-io = "0.2.0"
urma-workflows = "0.2.0"
fs2 = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "avif-native"] }
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bitcoin = { version = "0.32", features = ["serde"] }
urma-profiles = "0.2.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[dev-dependencies]
tempfile = "3"
rand = "0.8"
