[package]
name = "urma-wire-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "URMA Wire Tauri 2 host shell"

[lib]
name = "wire_app_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wire-app-shared = { path = "../app-shared" }

urma-identity = "0.1.0"
urma-io = "0.1.0"
zeroize = "1"
