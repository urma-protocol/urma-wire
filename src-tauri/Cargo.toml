[package]
name = "urma-wire-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "URMA Wire Tauri 2 host shell"

[lib]
name = "wire_app_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
wire-app-core = { path = "../app-core" }
wire-app-engine = { path = "../app-engine" }
