[package]
name = "wire-app-ui"
version = "0.1.0"
edition = "2021"
publish = false
license = "0BSD"
authors = ["Cristian Zmole <urma@rosint.org>"]
description = "URMA Wire Leptos CSR user interface"

[features]
fixture-harness = ["wire-app-engine/fixture-harness"]

[dependencies]
wire-app-core = { path = "../app-core" }
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
leptos_meta = "0.7"
thaw = { version = "=0.4.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
tracing = "0.1"
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "ScrollToOptions",
    "ScrollBehavior",
    "CssStyleDeclaration",
    "DomRect"
] }
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wire-app-engine = { path = "../app-engine" }
