[package]
name = "wire-app-ui"
version = "0.1.0"
edition = "2021"
publish = false
description = "URMA Wire Leptos CSR user interface"

[dependencies]
wire-app-shared = { path = "../app-shared" }
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
leptos_meta = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement"
] }
wasm-bindgen-futures = "0.4"
