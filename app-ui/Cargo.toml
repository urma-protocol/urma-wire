[package]
name = "wire-app-ui"
version = "0.1.0"
edition = "2021"
publish = false
description = "URMA Wire Leptos CSR user interface"

[features]
browser-fixture-test = []

[dependencies]
wire-app-shared = { path = "../app-shared" }
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
leptos_meta = "0.7"
thaw = { version = "=0.4.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement"
] }
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
urma-identity = "0.2.0"
urma-runtime = "0.2.0"
urma-chain = "0.2.0"
urma-core = "0.2.0"
urma-wallet = "0.2.0"
urma-wire = "0.2.0"
urma-profiles = "0.2.0"
getrandom = { version = "0.2", features = ["js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
zeroize = "1"
bitcoin = { version = "0.32", features = ["serde"] }
hex = "0.4"
js-sys = "0.3"
